# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Informational only — the actual Compose version is pinned by the
# compose-bom platform in app/build.gradle.kts (BOM 2024.12.01 = Compose 1.7.6).
compose.version=1.7.6
# Kotlin version
kotlin.code.style=official
# Disable automatic AndroidX mapping
android.nonTransitiveRClass=true
# AGP 8.3.0 predates official compileSdk 35 testing, but the project
# intentionally targets API 35 for current Play distribution.
android.suppressUnsupportedCompileSdk=35
