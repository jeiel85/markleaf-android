name: Android Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      record_roborazzi:
        description: 'Record Roborazzi golden images on this Linux runner and upload them as an artifact (commit them locally to update goldens to the canonical CI rendering).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # 버전 표기·릴리스 노트 검사는 Gradle 앞에 둔다. 초 단위로 끝나고, 릴리스
      # 준비 커밋에서 빠뜨리기 가장 쉬운 것들이라 먼저 실패하는 편이 낫다.
      - name: Verify public version strings (landing + README)
        run: pwsh -File scripts/verify-landing-versions.ps1

      - name: Verify release notes (fastlane changelogs + CHANGELOG parity)
        run: pwsh -File scripts/verify-release-notes.ps1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Verify debug APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Run tests
        run: ./gradlew test

      - name: Verify Roborazzi snapshots (visual regression)
        run: ./gradlew verifyRoborazziDebug

      - name: Upload Roborazzi diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diff-images
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore

      - name: Run release lint (hard gate)
        run: ./gradlew :app:lintRelease

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-release
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Build release APK with R8 (hard gate, unsigned ok)
        run: ./gradlew :app:assembleRelease

      - name: Verify release APK exists and is non-empty
        run: |
          APK="$(python3 -c 'import glob, os, sys; preferred = ["app/build/outputs/apk/release/app-release.apk", "app/build/outputs/apk/release/app-release-unsigned.apk"]; paths = [p for p in preferred if os.path.isfile(p)] or sorted(glob.glob("app/build/outputs/apk/release/*.apk")); print(paths[0] if paths else ""); sys.exit(0 if paths else 1)')"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload R8 mapping artifact (build job)
        uses: actions/upload-artifact@v7
        with:
          name: markleaf-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # PR·push 검증마다 새로 생기는 사본이라 사후 추적 가치가 없다.
          # 릴리스 시점 mapping 은 release job 이 따로 보관한다.
          retention-days: 7

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: markleaf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # 검증용 임시 산출물이라 기본 90일까지 둘 이유가 없다. 릴리스 산출물
          # (aab / mapping) 과 달리 사후 추적에도 쓰이지 않으므로 7일로 줄인다.
          retention-days: 7

  launch-smoke:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK for smoke launch
        run: ./gradlew assembleDebug

      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          script: |
            chmod +x .github/scripts/launch-smoke.sh
            ./.github/scripts/launch-smoke.sh

  # 계측 테스트. `connectedDebugAndroidTest` 는 GitHub 호스티드 에뮬레이터에서
  # 동작하지 않는다 — ddmlib 의 PropertyFetcher 가 API 레벨을 못 받아와서 Gradle 이
  # "0 of which were compatible" 로 끝난다(#235, 네 번 재현). 관리형 기기(AGP
  # managed device)는 그 탐색 경로를 아예 지나가지 않고 AGP 가 직접 에뮬레이터를
  # 띄우고 붙이고 내린다.
  #
  # launch-smoke 와 같은 이유로 아직 continue-on-error 다. 몇 번 연속 초록을
  # 확인한 뒤에 필수 체크로 승격하는 것이 순서다 — 검증되지 않은 게이트를
  # 보호된 main 에 먼저 걸지 않는다.
  instrumented-tests:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 러너에 /dev/kvm 은 있지만 기본 권한이 막혀 있다. 열어 주지 않으면
      # 에뮬레이터가 소프트웨어 렌더링으로 떨어져 사실상 쓸 수 없다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 관리형 기기는 실행 시점에 시스템 이미지를 직접 설치한다. 러너 이미지에
      # 그 라이선스는 수락돼 있지 않아서, 없으면 `ciAtdApi30Setup` 이
      # LicenceNotAcceptedException 으로 죽는다
      # (system-images;android-30;aosp_atd;x86).
      - name: Accept Android SDK licences
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -n "$sdkmanager" || { echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null

      - name: Run instrumented tests on a managed device
        run: ./gradlew :app:ciAtdApi30DebugAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7

  record-roborazzi:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.record_roborazzi == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record Roborazzi golden images on Linux runner
        run: ./gradlew recordRoborazziDebug

      - name: Upload regenerated goldens as artifact
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-goldens-linux
          path: app/src/test/snapshots/roborazzi/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # 태그 push 에서도 build 가 돌지만, needs 가 없으면 둘이 병렬로 달려서 게이트가
    # 빨개져도 릴리스가 그대로 발행된다. release 는 자체적으로 test 만 재실행하므로
    # lintRelease·verifyRoborazziDebug·버전 표기 검사는 아무도 확인하지 않은 채
    # 지나간다. 릴리스가 몇 분 늦어지는 대신 게이트를 실제 게이트로 만든다 (#184).
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MARKLEAF_RELEASE_CERT_SHA256: 0be97352a650c3d1a3d2332fd18afc44e0c95a4abca347e9250a2b8a7eecf91a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          MARKLEAF_RELEASE_KEYSTORE_BASE64: ${{ secrets.MARKLEAF_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$MARKLEAF_RELEASE_KEYSTORE_BASE64"
          mkdir -p release
          printf '%s' "$MARKLEAF_RELEASE_KEYSTORE_BASE64" | base64 -d > release/markleaf-release.p12
          test -s release/markleaf-release.p12

      - name: Run tests
        run: ./gradlew test

      - name: Build signed release APK and Play Console AAB
        env:
          MARKLEAF_RELEASE_STORE_FILE: release/markleaf-release.p12
          MARKLEAF_RELEASE_STORE_PASSWORD: ${{ secrets.MARKLEAF_RELEASE_STORE_PASSWORD }}
          MARKLEAF_RELEASE_KEY_ALIAS: ${{ secrets.MARKLEAF_RELEASE_KEY_ALIAS }}
          MARKLEAF_RELEASE_KEY_PASSWORD: ${{ secrets.MARKLEAF_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_markleaf.requireReleaseSigning: "true"
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :app:bundleRelease

      - name: Verify release signing certificate
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(python3 -c 'import glob, os, sys; paths = sorted(p for p in glob.glob("app/build/**/*.apk", recursive=True) if "release" in os.path.basename(p).lower() or "/release/" in p.replace("\\", "/").lower()); print(paths[0] if paths else ""); sys.exit(0 if paths else 1)')"
          fi
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" > signing-report.txt
          cat signing-report.txt
          ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest/ { print tolower($3); exit }' signing-report.txt)"
          EXPECTED_SHA256="$(printf '%s' "$MARKLEAF_RELEASE_CERT_SHA256" | tr 'A-F' 'a-f')"
          printf 'ACTUAL_SHA256=%s\n' "$ACTUAL_SHA256"
          printf 'EXPECTED_SHA256=%s\n' "$EXPECTED_SHA256"
          test -n "$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Prepare release asset
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(python3 -c 'import glob, os, sys; paths = sorted(p for p in glob.glob("app/build/**/*.apk", recursive=True) if "release" in os.path.basename(p).lower() or "/release/" in p.replace("\\", "/").lower()); print(paths[0] if paths else ""); sys.exit(0 if paths else 1)')"
          fi
          test -f "$APK"
          cp "$APK" "markleaf-${GITHUB_REF_NAME}.apk"
          test -s "markleaf-${GITHUB_REF_NAME}.apk"
          ls -lh "markleaf-${GITHUB_REF_NAME}.apk"

      - name: Verify Play Console AAB exists
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          test -s "$AAB"
          ls -lh "$AAB"

      - name: Verify R8 mapping exists
        run: |
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          test -f "$MAPPING"
          test -s "$MAPPING"
          ls -lh "$MAPPING"

      - name: Upload Play Console AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: markleaf-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          # Play Console 업로드용 산출물이라 업로드가 끝나면 쓸모가 없다.
          # 릴리스 에셋으로는 배포하지 않으므로 14일이면 충분하다.
          retention-days: 14

      - name: Upload R8 mapping artifact (release job)
        uses: actions/upload-artifact@v7
        with:
          name: markleaf-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # 릴리스 에셋에서 뺀 뒤로는 GitHub 쪽 유일한 사본이다(영구 사본은
          # D:\Build 와 GitLab 패키지 레지스트리, D064). 크래시 역난독화
          # 요청이 뒤늦게 들어올 여유를 두어 30일로 잡는다.
          retention-days: 30

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            BEGIN { heading = "## v" version }
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " " || substr($0, length(heading) + 1, 1) == "-") {
              sub(/^## /, "")
              sub(/ - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/, "")
              print
              exit
            }
          ' CHANGELOG.md > release-title.txt
          test -s release-title.txt
          awk -v version="$VERSION" '
            BEGIN { heading = "## v" version }
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " " || substr($0, length(heading) + 1, 1) == "-") {
              found = 1; next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "markleaf-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md

      # The four versioned files the GitLab Release carries. Built here rather
      # than on GitLab because GitLab's tag pipeline has not run since its
      # monthly CI minutes ran out (#252) — the APIs below do not consume them,
      # only the pipeline did.
      #
      # assembleRelease and bundleRelease already ran above; this re-runs them
      # as dependencies, finds them up to date, and copies the outputs out under
      # their versioned names alongside the six-locale notes.
      - name: Export versioned release artifacts
        env:
          MARKLEAF_RELEASE_STORE_FILE: release/markleaf-release.p12
          MARKLEAF_RELEASE_STORE_PASSWORD: ${{ secrets.MARKLEAF_RELEASE_STORE_PASSWORD }}
          MARKLEAF_RELEASE_KEY_ALIAS: ${{ secrets.MARKLEAF_RELEASE_KEY_ALIAS }}
          MARKLEAF_RELEASE_KEY_PASSWORD: ${{ secrets.MARKLEAF_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_markleaf.requireReleaseSigning: "true"
        run: |
          rm -rf dist
          ./gradlew :app:exportReleaseArtifacts -Pmarkleaf.releaseExportDir=dist
          ls -lh dist

      # After the GitHub release, deliberately: GitHub is the primary path and
      # must not be blocked by the mirror. A failure here still reddens the job
      # — a mirror that quietly does nothing is what #247 was about.
      - name: Publish the GitLab release
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          chmod +x .github/scripts/mirror-release-to-gitlab.sh
          ./.github/scripts/mirror-release-to-gitlab.sh
